<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - King Digital Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100 max-w-md w-full relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 to-indigo-600"></div>

        <div class="text-center mb-6 pt-2">
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">King Digital Premium</h1>
            <p class="text-sm text-slate-500 font-medium mt-1">Powered by King Digital Payment</p>
        </div>

        <div class="flex justify-center items-center space-x-4 mb-8 bg-slate-50 py-3 rounded-xl border border-slate-100">
            <div class="flex items-center text-xs font-semibold text-emerald-600">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
                100% Safe
            </div>
            <div class="w-px h-4 bg-slate-200"></div>
            <div class="flex items-center text-xs font-semibold text-blue-600">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                Trusted Gateway
            </div>
        </div>
        
        <div class="text-center mb-8">
            <p class="text-sm text-slate-500 mb-1">Total Pembayaran</p>
            <div class="text-4xl font-extrabold text-slate-900">
                Rp 150.000
            </div>
        </div>

        <button 
            id="payButton"
            class="group relative w-full flex justify-center py-3.5 px-4 rounded-xl font-semibold text-white bg-indigo-600 hover:bg-indigo-700 shadow-md hover:shadow-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
        >
            <svg id="loadingSpinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span id="buttonText">Lanjutkan Pembayaran</span>
        </button>

        <div class="mt-8 text-center border-t border-slate-100 pt-4">
            <p class="text-xs text-slate-400 font-medium tracking-wide uppercase">
                &copy; KDP Team 2026
            </p>
        </div>

    </div>

    <script>
        const payButton = document.getElementById('payButton');
        const buttonText = document.getElementById('buttonText');
        const loadingSpinner = document.getElementById('loadingSpinner');

        payButton.addEventListener('click', async () => {
            // Ubah UI ke mode loading
            payButton.disabled = true;
            payButton.classList.replace('bg-indigo-600', 'bg-slate-400');
            payButton.classList.replace('hover:bg-indigo-700', 'hover:bg-slate-400');
            payButton.classList.remove('hover:shadow-lg');
            buttonText.innerText = "Memproses Transaksi...";
            loadingSpinner.classList.remove('hidden');

            try {
                // Menembak file ipaymu.js di backend Netlify Functions
                const response = await fetch('/.netlify/functions/ipaymu', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        order_id:"KDP-" +Date.now(mount: 150000,
                        name: "pelanggan premium",
                        Phone: "08111222333",
                        Email: "member@kingdigitalpremium.my.id",
                        amount: "150000" // Nominal harga
                    })
                });

                const data = await response.json();

                if (data.success && data.paymentUrl) {
                    // Redirect ke iPaymu
                    window.location.href = data.paymentUrl;
                } else {
                    alert("Maaf, pembayaran gagal diproses: " + (data.error || "Sistem error"));
                    resetButtonUI();
                }
            } catch (error) {
                console.error("Error Detail:", error);
                alert("Terjadi kesalahan jaringan, silakan coba beberapa saat lagi.");
                resetButtonUI();
            }
        });

        function resetButtonUI() {
            // Kembalikan UI tombol ke semula jika terjadi error
            payButton.disabled = false;
            payButton.classList.replace('bg-slate-400', 'bg-indigo-600');
            payButton.classList.replace('hover:bg-slate-400', 'hover:bg-indigo-700');
            payButton.classList.add('hover:shadow-lg');
            buttonText.innerText = "Lanjutkan Pembayaran";
            loadingSpinner.classList.add('hidden');
        }
    </script>
</body>
</html>
